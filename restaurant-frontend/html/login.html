<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - La Bucatarie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/manager.css">
</head>
<body class="login-page">
    <section class="login-panel">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-mark">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div class="brand-copy">
                    <strong>La Bucatarie</strong>
                    <span>Restaurant management system</span>
                </div>
            </div>

            <h1>Autentificare</h1>
            <p>Acces rapid pentru manager, personal, chelneri si clienti.</p>

            <form id="loginForm" class="login-form">
                <div class="field">
                    <label for="username">Email sau username</label>
                    <input id="username" type="text" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Parola</label>
                    <div class="password-wrap">
                        <input id="password" type="password" autocomplete="current-password" required>
                        <button class="password-toggle" id="togglePassword" type="button" aria-label="Afiseaza parola">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <p class="login-error" id="loginError" role="alert"></p>

                <button class="btn btn-primary" id="loginButton" type="submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Login</span>
                </button>
            </form>
        </div>
    </section>

    <section class="login-aside" aria-hidden="true">
        <div class="login-aside-content">
            <h2>Comenzi, echipa si meniu intr-un singur loc.</h2>
            <p>O interfata clara pentru ture aglomerate, decizii rapide si operatiuni fara frictiune.</p>
        </div>
    </section>

    <script src="../js/login.js"></script>
</body>
</html>
